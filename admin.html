<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Muscle - Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  
  <script>
    if (localStorage.getItem('adminToken') !== 'bigmuscle_secure_token_2024') {
      window.location.replace('admin-login.html');
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background-color: #0d0d0d; color: #fff; padding: 20px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #E60000; padding-bottom: 15px; margin-bottom: 25px; }
    .header-title { font-family: 'Oswald', sans-serif; color: #E60000; font-size: 2rem; display: flex; align-items: center; gap: 10px; }
    .header-controls { display: flex; align-items: center; gap: 12px; }
    .notif-badge-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px 14px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; position: relative; }
    .notif-badge-btn:hover { border-color: #E60000; }
    .notif-count { background: #E60000; color: #fff; font-size: 0.75rem; padding: 2px 6px; border-radius: 50%; font-family: 'Oswald'; }
    .logout-btn { background: #E60000; color: #fff; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; }
    .logout-btn:hover { background: #b30000; }
    
    .toast-container { position: fixed; top: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast-msg { background: #1a1a1a; border-right: 4px solid #E60000; color: #fff; padding: 12px 18px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    .admin-section { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 20px; margin-bottom: 30px; }
    .admin-section h2 { font-family: 'Oswald', sans-serif; color: #fff; font-size: 1.5rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.85rem; color: #aaa; }
    .form-group input, .form-group select, .form-group textarea { background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; outline: none; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #E60000; }
    .form-group textarea { resize: vertical; min-height: 70px; }
    
    .submit-btn { background: #E60000; color: #fff; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    .cancel-btn { background: #444; color: #fff; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-right: 10px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid #222; font-size: 0.9rem; }
    th { background: #111; color: #E60000; font-family: 'Oswald', sans-serif; }
    .action-btn { background: #ff3333; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .edit-btn { background: #ffaa00; color: #111; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 5px; font-weight: bold; }
    .img-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid #333; }

    tr.new-order-row { animation: pulseRow 1.5s infinite alternate; background-color: rgba(230, 0, 0, 0.15) !important; }
    @keyframes pulseRow { from { background-color: rgba(230, 0, 0, 0.05); } to { background-color: rgba(230, 0, 0, 0.25); } }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="header-bar">
    <div class="header-title">
      <i class="fa-solid fa-gauge-high"></i> BIG MUSCLE DASHBOARD
    </div>
    <div class="header-controls">
      <button class="notif-badge-btn" onclick="enableBrowserNotifications()" id="enableNotifBtn">
        <i class="fa-solid fa-bell"></i> الإشعارات
        <span class="notif-count" id="ordersBadge">0</span>
      </button>
      <button class="logout-btn" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>

  <!-- Categories -->
  <div class="admin-section">
    <h2><i class="fa-solid fa-tags"></i> إدارة التصنيفات</h2>
    <form id="categoryForm">
      <div class="form-grid">
        <div class="form-group">
          <label>اسم التصنيف (EN)</label>
          <input type="text" id="catName" required placeholder="e.g. Proteins">
        </div>
        <div class="form-group">
          <label>اسم التصنيف (AR)</label>
          <input type="text" id="catNameAr" required placeholder="مثال: بروتين">
        </div>
      </div>
      <button type="submit" class="submit-btn"><i class="fa-solid fa-plus"></i> إضافة تصنيف</button>
    </form>
    <table>
      <thead>
        <tr><th>الاسم (EN)</th><th>الاسم (AR)</th><th>إجراءات</th></tr>
      </thead>
      <tbody id="categoriesTable"></tbody>
    </table>
  </div>

  <!-- Products -->
  <div class="admin-section">
    <h2 id="productFormTitle"><i class="fa-solid fa-box-open"></i> إضافة منتج جديد</h2>
    <form id="productForm">
      <input type="hidden" id="editProductId" value="">
      <div class="form-grid">
        <div class="form-group">
          <label>اسم المنتج (EN)</label>
          <input type="text" id="prodName" required>
        </div>
        <div class="form-group">
          <label>اسم المنتج (AR)</label>
          <input type="text" id="prodNameAr" required>
        </div>
        <div class="form-group">
          <label>السعر (ج.م)</label>
          <input type="number" id="prodPrice" required>
        </div>
        <div class="form-group">
          <label>التصنيف</label>
          <select id="prodCategory" required></select>
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>وصف المنتج (EN)</label>
          <textarea id="prodDesc" placeholder="Product details, ingredients, usage..."></textarea>
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>وصف المنتج (AR)</label>
          <textarea id="prodDescAr" placeholder="تفاصيل المنتج، المكونات، طريقة الاستخدام..."></textarea>
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>صور المنتج (يمكنك تحديد حتى 5 صور)</label>
          <input type="file" id="prodImages" accept="image/*" multiple>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="prodSubmitBtn"><i class="fa-solid fa-plus"></i> حفظ المنتج</button>
      <button type="button" class="cancel-btn" id="prodCancelBtn" style="display:none;" onclick="resetProductForm()">إلغاء التعديل</button>
    </form>
    <table>
      <thead>
        <tr><th>الصورة</th><th>الاسم (AR)</th><th>السعر</th><th>التصنيف</th><th>إجراءات</th></tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </div>

  <!-- Offers -->
  <div class="admin-section">
    <h2 id="offerFormTitle"><i class="fa-solid fa-fire"></i> إضافة عرض جديد</h2>
    <form id="offerForm">
      <input type="hidden" id="editOfferId" value="">
      <div class="form-grid">
        <div class="form-group"><label>العنوان (EN)</label><input type="text" id="offTitle" required></div>
        <div class="form-group"><label>العنوان (AR)</label><input type="text" id="offTitleAr" required></div>
        <div class="form-group"><label>نسبة الخصم (EN)</label><input type="text" id="offDisc" placeholder="e.g. 20% OFF" required></div>
        <div class="form-group"><label>نسبة الخصم (AR)</label><input type="text" id="offDiscAr" placeholder="مثال: خصم 20%" required></div>
        <div class="form-group"><label>السعر بعد الخصم</label><input type="number" id="offPrice" required></div>
        <div class="form-group"><label>الصورة</label><input type="file" id="offImage" accept="image/*"></div>
        <div class="form-group" style="grid-column: span 2;"><label>الوصف (EN)</label><input type="text" id="offDesc" required></div>
        <div class="form-group" style="grid-column: span 2;"><label>الوصف (AR)</label><input type="text" id="offDescAr" required></div>
      </div>
      <button type="submit" class="submit-btn" id="offSubmitBtn"><i class="fa-solid fa-plus"></i> حفظ العرض</button>
      <button type="button" class="cancel-btn" id="offCancelBtn" style="display:none;" onclick="resetOfferForm()">إلغاء التعديل</button>
    </form>
    <table>
      <thead>
        <tr><th>الصورة</th><th>العنوان (AR)</th><th>السعر</th><th>إجراءات</th></tr>
      </thead>
      <tbody id="offersTable"></tbody>
    </table>
  </div>

  <!-- Orders -->
  <div class="admin-section">
    <h2><i class="fa-solid fa-cart-shopping"></i> الطلبات الواردة</h2>
    <table>
      <thead>
        <tr><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>العنوان</th><th>المنتجات</th><th>الإجمالي</th><th>إجراءات</th></tr>
      </thead>
      <tbody id="ordersTable"></tbody>
    </table>
  </div>

  <audio id="orderAudioSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    const API_URL = '/api';

    function logoutAdmin() {
      localStorage.removeItem('adminToken');
      window.location.replace('admin-login.html');
    }

    let lastKnownOrderIds = JSON.parse(localStorage.getItem('lastOrderIds') || '[]');
    let isFirstOrdersLoad = true;

    document.addEventListener('DOMContentLoaded', () => {
      loadCategories();
      loadProducts();
      loadOffers();
      loadOrders();
      setInterval(loadOrdersOnly, 10000);
    });

    // Notifications
    function enableBrowserNotifications() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            showToast("تم تفعيل إشعارات المتصفح بنجاح!");
          }
        });
      }
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast-msg';
      toast.innerHTML = `<i class="fa-solid fa-bell" style="color:#E60000;"></i> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function playSound() {
      const audio = document.getElementById('orderAudioSound');
      if (audio) audio.play().catch(() => {});
    }

    function triggerNotification(order) {
      showToast(`طلب جديد من: ${order.customerName} بقيمة ${order.totalAmount} ج.م`);
      playSound();
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("🛒 طلب جديد في Big Muscle!", {
          body: `${order.customerName} - ${order.totalAmount} ج.م`,
          icon: 'images/logo.png'
        });
      }
    }

    // Categories
    async function loadCategories() {
      const res = await fetch(`${API_URL}/categories`);
      const cats = await res.json();
      const tbody = document.getElementById('categoriesTable');
      const select = document.getElementById('prodCategory');
      tbody.innerHTML = '';
      select.innerHTML = '<option value="">اختر التصنيف</option>';
      cats.forEach(c => {
        tbody.innerHTML += `<tr><td>${c.name}</td><td>${c.nameAr}</td><td><button class="action-btn" onclick="deleteCategory('${c._id}')">حذف</button></td></tr>`;
        select.innerHTML += `<option value="${c.name}">${c.nameAr} (${c.name})</option>`;
      });
    }

    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(`${API_URL}/categories`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name: document.getElementById('catName').value, nameAr: document.getElementById('catNameAr').value })
      });
      e.target.reset();
      loadCategories();
    });

    async function deleteCategory(id) {
      if (confirm('هل أنت تأكد من الحذف؟')) {
        await fetch(`${API_URL}/categories/${id}`, { method: 'DELETE' });
        loadCategories();
      }
    }

    // Products
    async function loadProducts() {
      const res = await fetch(`${API_URL}/products`);
      const prods = await res.json();
      const tbody = document.getElementById('productsTable');
      tbody.innerHTML = '';
      prods.forEach(p => {
        const img = (p.images && p.images.length > 0) ? p.images[0] : (p.image || '');
        tbody.innerHTML += `
          <tr>
            <td><img src="${img}" class="img-preview" onerror="this.src='https://via.placeholder.com/45'"></td>
            <td>${p.nameAr}</td>
            <td>${p.price} ج.م</td>
            <td>${p.category}</td>
            <td>
              <button class="edit-btn" onclick='editProduct(${JSON.stringify(p)})'>تعديل</button>
              <button class="action-btn" onclick="deleteProduct('${p._id}')">حذف</button>
            </td>
          </tr>`;
      });
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editProductId').value;
      const formData = new FormData();
      formData.append('name', document.getElementById('prodName').value);
      formData.append('nameAr', document.getElementById('prodNameAr').value);
      formData.append('price', document.getElementById('prodPrice').value);
      formData.append('category', document.getElementById('prodCategory').value);
      formData.append('description', document.getElementById('prodDesc').value);
      formData.append('descriptionAr', document.getElementById('prodDescAr').value);

      const files = document.getElementById('prodImages').files;
      for (let i = 0; i < files.length; i++) {
        formData.append('images', files[i]);
      }

      if (id) {
        await fetch(`${API_URL}/products/${id}`, { method: 'PUT', body: formData });
      } else {
        await fetch(`${API_URL}/products`, { method: 'POST', body: formData });
      }
      resetProductForm();
      loadProducts();
    });

    function editProduct(p) {
      document.getElementById('editProductId').value = p._id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodNameAr').value = p.nameAr;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodCategory').value = p.category;
      document.getElementById('prodDesc').value = p.description || '';
      document.getElementById('prodDescAr').value = p.descriptionAr || '';
      document.getElementById('productFormTitle').innerText = 'تعديل المنتج';
      document.getElementById('prodSubmitBtn').innerHTML = '<i class="fa-solid fa-save"></i> حفظ التعديلات';
      document.getElementById('prodCancelBtn').style.display = 'inline-block';
    }

    function resetProductForm() {
      document.getElementById('productForm').reset();
      document.getElementById('editProductId').value = '';
      document.getElementById('productFormTitle').innerText = 'إضافة منتج جديد';
      document.getElementById('prodSubmitBtn').innerHTML = '<i class="fa-solid fa-plus"></i> حفظ المنتج';
      document.getElementById('prodCancelBtn').style.display = 'none';
    }

    async function deleteProduct(id) {
      if (confirm('تأكيد الحذف؟')) {
        await fetch(`${API_URL}/products/${id}`, { method: 'DELETE' });
        loadProducts();
      }
    }

    // Offers
    async function loadOffers() {
      const res = await fetch(`${API_URL}/offers`);
      const offers = await res.json();
      const tbody = document.getElementById('offersTable');
      tbody.innerHTML = '';
      offers.forEach(o => {
        tbody.innerHTML += `
          <tr>
            <td><img src="${o.image}" class="img-preview" onerror="this.src='https://via.placeholder.com/45'"></td>
            <td>${o.titleAr}</td>
            <td>${o.price} ج.م</td>
            <td>
              <button class="edit-btn" onclick='editOffer(${JSON.stringify(o)})'>تعديل</button>
              <button class="action-btn" onclick="deleteOffer('${o._id}')">حذف</button>
            </td>
          </tr>`;
      });
    }

    document.getElementById('offerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editOfferId').value;
      const formData = new FormData();
      formData.append('title', document.getElementById('offTitle').value);
      formData.append('titleAr', document.getElementById('offTitleAr').value);
      formData.append('discountText', document.getElementById('offDisc').value);
      formData.append('discountTextAr', document.getElementById('offDiscAr').value);
      formData.append('price', document.getElementById('offPrice').value);
      formData.append('description', document.getElementById('offDesc').value);
      formData.append('descriptionAr', document.getElementById('offDescAr').value);
      if (document.getElementById('offImage').files[0]) {
        formData.append('image', document.getElementById('offImage').files[0]);
      }

      if (id) {
        await fetch(`${API_URL}/offers/${id}`, { method: 'PUT', body: formData });
      } else {
        await fetch(`${API_URL}/offers`, { method: 'POST', body: formData });
      }
      resetOfferForm();
      loadOffers();
    });

    function editOffer(o) {
      document.getElementById('editOfferId').value = o._id;
      document.getElementById('offTitle').value = o.title;
      document.getElementById('offTitleAr').value = o.titleAr;
      document.getElementById('offDisc').value = o.discountText;
      document.getElementById('offDiscAr').value = o.discountTextAr;
      document.getElementById('offPrice').value = o.price;
      document.getElementById('offDesc').value = o.description;
      document.getElementById('offDescAr').value = o.descriptionAr;
      document.getElementById('offerFormTitle').innerText = 'تعديل العرض';
      document.getElementById('offSubmitBtn').innerHTML = '<i class="fa-solid fa-save"></i> حفظ التعديلات';
      document.getElementById('offCancelBtn').style.display = 'inline-block';
    }

    function resetOfferForm() {
      document.getElementById('offerForm').reset();
      document.getElementById('editOfferId').value = '';
      document.getElementById('offerFormTitle').innerText = 'إضافة عرض جديد';
      document.getElementById('offSubmitBtn').innerHTML = '<i class="fa-solid fa-plus"></i> حفظ العرض';
      document.getElementById('offCancelBtn').style.display = 'none';
    }

    async function deleteOffer(id) {
      if (confirm('تأكيد الحذف؟')) {
        await fetch(`${API_URL}/offers/${id}`, { method: 'DELETE' });
        loadOffers();
      }
    }

    // Orders
    async function loadOrders() {
      const res = await fetch(`${API_URL}/orders`);
      const orders = await res.json();
      renderOrders(orders, []);
    }

    async function loadOrdersOnly() {
      try {
        const res = await fetch(`${API_URL}/orders`);
        const orders = await res.json();
        const currentIds = orders.map(o => o._id);
        
        if (isFirstOrdersLoad) {
          lastKnownOrderIds = currentIds;
          localStorage.setItem('lastOrderIds', JSON.stringify(lastKnownOrderIds));
          isFirstOrdersLoad = false;
          renderOrders(orders, []);
          return;
        }

        const newOrders = orders.filter(o => !lastKnownOrderIds.includes(o._id));
        if (newOrders.length > 0) {
          newOrders.forEach(o => triggerNotification(o));
          const newIds = newOrders.map(o => o._id);
          lastKnownOrderIds = [...currentIds];
          localStorage.setItem('lastOrderIds', JSON.stringify(lastKnownOrderIds));
          renderOrders(orders, newIds);
        }
      } catch(e) {}
    }

    function renderOrders(orders, highlightIds) {
      const tbody = document.getElementById('ordersTable');
      tbody.innerHTML = '';
      document.getElementById('ordersBadge').innerText = orders.length;
      
      orders.forEach(o => {
        const isNew = highlightIds.includes(o._id);
        const itemsList = Array.isArray(o.items) ? o.items.map(i => `${i.name} (${i.quantity})`).join(', ') : '-';
        tbody.innerHTML += `
          <tr class="${isNew ? 'new-order-row' : ''}">
            <td>${new Date(o.date).toLocaleDateString('ar-EG')}</td>
            <td><strong>${o.customerName}</strong></td>
            <td>${o.phone}</td>
            <td>${o.address}</td>
            <td>${itemsList}</td>
            <td><strong style="color:#E60000">${o.totalAmount} ج.م</strong></td>
            <td><button class="action-btn" onclick="deleteOrder('${o._id}')">حذف</button></td>
          </tr>`;
      });
    }

    async function deleteOrder(id) {
      if (confirm('حذف الطلب؟')) {
        await fetch(`${API_URL}/orders/${id}`, { method: 'DELETE' });
        loadOrders();
      }
    }
  </script>
</body>
</html>
