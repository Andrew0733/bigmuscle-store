<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تأكيد الطلب - Big Muscle</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=16.0">
</head>
<body class="rtl">

  <!-- NAVBAR HEADER -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Big Muscle">
      </a>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="بحث..." autocomplete="off">
        <button type="button" id="searchBtn"><i class="fas fa-search"></i></button>
      </div>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="products.html">كل المنتجات</a></li>
        <li><a href="#" class="active">إتمام الطلب</a></li>
      </ul>
      <div class="nav-actions">
        <button class="lang-btn" id="langToggle">EN</button>
        <a href="cart.html" class="cart-icon">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="القائمة">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN CHECKOUT CONTAINER -->
  <main class="main-content">
    <div class="checkout-container">
      <h1 class="checkout-page-title"><i class="fas fa-truck-fast"></i> إتمام الشراء والتوصيل</h1>

      <form id="checkoutForm">
        
        <!-- Customer Details -->
        <div class="checkout-card">
          <h2 class="card-heading">بيانات الشحن والتوصيل</h2>
          
          <div class="checkout-field">
            <label for="custName">الاسم بالكامل *</label>
            <input type="text" id="custName" required placeholder="أدخل اسمك بالكامل">
          </div>

          <div class="checkout-field">
            <label for="custPhone">رقم الهاتف *</label>
            <input type="tel" id="custPhone" required placeholder="01xxxxxxxxx">
          </div>

          <div class="checkout-field">
            <label for="customerRegion">المنطقة / المحافظة *</label>
            <select id="customerRegion" required onchange="updateOrderTotal()">
              <option value="">اختر منطقتك لتحديد سعر التوصيل...</option>
              <option value="50">القاهرة / الجيزة / وجه بحري — 50 ج.م</option>
              <option value="60">الإسكندرية — 60 ج.م</option>
              <option value="70">محافظات الدلتا والقناة — 70 ج.م</option>
              <option value="90">صعيد مصر — 90 ج.م</option>
              <option value="120">سيناء / البحر الأحمر / مطروح — 120 ج.م</option>
            </select>
          </div>

          <div class="checkout-field">
            <label for="custAddress">العنوان بالتفصيل *</label>
            <textarea id="custAddress" rows="3" required placeholder="اسم الشارع، رقم العمارة، رقم الشقة..."></textarea>
          </div>
        </div>

        <!-- Summary -->
        <div class="checkout-card">
          <h2 class="card-heading">ملخص الحساب</h2>

          <div class="summary-line">
            <span>سعر المنتجات:</span>
            <strong id="subtotalText">0 EGP</strong>
          </div>

          <div class="summary-line">
            <span>سعر التوصيل:</span>
            <strong id="shippingText" style="color: #a0a0a0;">اختر المنطقة</strong>
          </div>

          <div class="summary-divider"></div>

          <div class="summary-line total-line">
            <span>الإجمالي:</span>
            <strong id="totalText">0 EGP</strong>
          </div>

          <button type="submit" class="confirm-order-btn" id="submitBtn">
            Confirm Order (Cash on Delivery)
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function extractNumber(val) {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const match = String(val).match(/\d+(\.\d+)?/);
      return match ? parseFloat(match[0]) : 0;
    }

    function getCheckoutCart() {
      const keys = ['bigmuscle_cart', 'cart', 'bigmuscleCart'];
      for (let k of keys) {
        try {
          const raw = localStorage.getItem(k);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed;
            }
          }
        } catch(e) {}
      }
      return [];
    }

    let cartSubtotal = 0;
    let cartItems = [];

    document.addEventListener('DOMContentLoaded', () => {
      cartItems = getCheckoutCart();

      if (!cartItems || cartItems.length === 0) {
        alert("السلة فارغة! قم بإضافة منتجات أولاً.");
        window.location.href = "products.html";
        return;
      }

      cartSubtotal = 0;
      cartItems.forEach(item => {
        const itemPrice = extractNumber(item.price);
        const itemQty = extractNumber(item.quantity || item.qty || 1) || 1;
        cartSubtotal += (itemPrice * itemQty);
      });

      document.getElementById('subtotalText').textContent = cartSubtotal + ' EGP';
      document.getElementById('totalText').textContent = cartSubtotal + ' EGP';

      updateOrderTotal();
    });

    function updateOrderTotal() {
      const regionSelect = document.getElementById('customerRegion');
      const shippingEl = document.getElementById('shippingText');
      const totalEl = document.getElementById('totalText');

      if (!regionSelect || !shippingEl || !totalEl) return;

      let shippingCost = extractNumber(regionSelect.value);

      // Fallback: extract number from selected option text if value failed
      if (shippingCost === 0 && regionSelect.selectedIndex > 0) {
        const optionText = regionSelect.options[regionSelect.selectedIndex].text;
        shippingCost = extractNumber(optionText);
      }

      if (shippingCost === 0 || regionSelect.selectedIndex === 0) {
        shippingEl.textContent = 'اختر المنطقة';
        shippingEl.style.color = '#a0a0a0';
        totalEl.textContent = cartSubtotal + ' EGP';
        return;
      }

      const grandTotal = cartSubtotal + shippingCost;
      shippingEl.textContent = shippingCost + ' EGP';
      shippingEl.style.color = '#ffffff';
      totalEl.textContent = grandTotal + ' EGP';
    }

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const regionSelect = document.getElementById('customerRegion');
      if (!regionSelect.value || regionSelect.selectedIndex === 0) {
        alert('من فضلك اختر المنطقة لتحديد سعر التوصيل.');
        return;
      }

      let shippingCost = extractNumber(regionSelect.value);
      if (shippingCost === 0 && regionSelect.selectedIndex > 0) {
        shippingCost = extractNumber(regionSelect.options[regionSelect.selectedIndex].text);
      }

      const grandTotal = cartSubtotal + shippingCost;
      const regionName = regionSelect.options[regionSelect.selectedIndex].text;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
      submitBtn.disabled = true;

      const orderData = {
        customerName: document.getElementById('custName').value.trim(),
        customerPhone: document.getElementById('custPhone').value.trim(),
        customerAddress: document.getElementById('custAddress').value.trim() + " (" + regionName + ")",
        cartItems: cartItems,
        totalAmount: grandTotal,
        shippingCost: shippingCost,
        status: "Pending"
      };

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        if (response.ok) {
          ['bigmuscle_cart', 'cart', 'bigmuscleCart'].forEach(k => localStorage.removeItem(k));
          window.location.href = `https://wa.me/201272069590?text=مرحباً، قمت بعمل طلب جديد بقيمة ${grandTotal} EGP. يرجى تأكيد الطلب.`;
        } else {
          alert('حدث خطأ أثناء حفظ الطلب. حاول مرة أخرى.');
          submitBtn.innerHTML = 'Confirm Order (Cash on Delivery)';
          submitBtn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        alert('تأكد من الاتصال بالإنترنت.');
        submitBtn.innerHTML = 'Confirm Order (Cash on Delivery)';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
