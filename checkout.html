<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Muscle | إتمام الطلب - Checkout</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

    <!-- Navbar Container -->
    <div id="navbar-placeholder"></div>

    <section class="section checkout-section" style="max-width: 650px; margin: 40px auto; padding: 0 15px;">
        <h2 class="section-title" data-ar="إتمام الطلب" data-en="CHECKOUT" style="text-align: center; margin-bottom: 25px;">إتمام الطلب</h2>

        <div class="checkout-container">
            <form id="checkout-form" class="checkout-form">
                <h3 data-ar="بيانات التوصيل" data-en="Delivery Details" style="margin-bottom: 15px; border-bottom: 2px solid #E60000; padding-bottom: 8px;">بيانات التوصيل</h3>

                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="text" id="name" placeholder="الاسم بالكامل | Full Name" required style="width: 100%; padding: 12px; font-size: 16px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="tel" id="phone" placeholder="رقم الهاتف | Phone Number" required style="width: 100%; padding: 12px; font-size: 16px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="customerRegion" style="display: block; margin-bottom: 5px; color: #ccc; font-size: 14px;">* المحافظة / المنطقة:</label>
                    <select id="customerRegion" required onchange="updateOrderTotal()" style="width: 100%; padding: 12px; font-size: 16px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
                        <option value="">... اختر المنطقة ...</option>
                        <option value="90">القاهرة / الجيزة / وجه بحري — 90 ج.م</option>
                        <option value="120">الصعيد / وجه قبلي — 120 ج.م</option>
                        <option value="130">سيناء / البحر الأحمر / مطروح — 130 ج.م</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="text" id="address" placeholder="العنوان بالتفصيل | Detailed Address" required style="width: 100%; padding: 12px; font-size: 16px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <textarea id="notes" placeholder="ملاحظات (اختياري) | Notes (Optional)" style="width: 100%; padding: 12px; font-size: 16px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; height: 80px; resize: vertical; box-sizing: border-box;"></textarea>
                </div>

                <!-- ملاحظة الشحن للكتل الزائدة -->
                <div class="shipping-weight-info" style="background: rgba(230, 0, 0, 0.08); border-right: 3px solid #E60000; padding: 12px 15px; margin: 15px 0 20px 0; border-radius: 6px;">
                    <p style="margin: 0; font-size: 13.5px; color: #dddddd; line-height: 1.5;">
                       💡 ملاحظة: المنتجات التي تزن أكثر من 2 كيلو يتم إضافة 8 جنيه على سعر التوصيل لكل كيلو زيادة.
                    </p>
                </div>

                <!-- ==================== مربع كود الخصم (Promo Code) ==================== -->
                <div class="promo-box" style="background: #151515; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 20px;">
                    <label style="display: block; color: #ddd; font-size: 14px; margin-bottom: 8px; font-weight: bold;">🎟️ هل لديك كود خصم؟</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="promoCodeInput" placeholder="ادخل كود الخصم هنا..." style="flex: 1; padding: 10px; font-size: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; text-transform: uppercase;">
                        <button type="button" id="applyPromoBtn" onclick="applyPromoCode()" style="background: #E60000; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap;">تطبيق</button>
                        <button type="button" id="removePromoBtn" onclick="removePromoCode()" style="display: none; background: #333; color: #ff4444; border: 1px solid #555; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap;">إلغاء</button>
                    </div>
                    <p id="promoStatusMsg" style="margin: 8px 0 0 0; font-size: 13px; display: none; font-weight: bold;"></p>
                </div>

                <!-- ملخص الفاتورة -->
                <div class="order-summary-box" style="background: #111; border: 1px solid #262626; border-radius: 8px; padding: 18px; margin: 20px 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px;">
                        <span>سعر المنتجات:</span>
                        <strong id="subtotalText" style="color: #fff;">0 EGP</strong>
                    </div>

                    <!-- سطر الخصم التلقائي من العرض -->
                    <div id="autoDiscountRow" style="display: none; justify-content: space-between; margin-bottom: 12px; font-size: 15px; color: #00cc66;">
                        <span id="autoDiscountLabel">خصم العرض:</span>
                        <strong id="autoDiscountText">-0 EGP</strong>
                    </div>

                    <!-- سطر الخصم المطبق بكود الخصم -->
                    <div id="promoDiscountRow" style="display: none; justify-content: space-between; margin-bottom: 12px; font-size: 15px; color: #00cc66;">
                        <span id="promoDiscountLabel">كود الخصم:</span>
                        <strong id="promoDiscountText">-0 EGP</strong>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px;">
                        <span>سعر التوصيل:</span>
                        <strong id="shippingText" style="color: #ff9900;">اختر المنطقة</strong>
                    </div>

                    <hr style="border: 0; border-top: 1px solid #333; margin: 12px 0;">
                    
                    <div style="display: flex; justify-content: space-between; font-size: 1.2rem; color: #E60000; font-weight: bold;">
                        <span>الإجمالي:</span>
                        <strong id="totalText">0 EGP</strong>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background: #E60000; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s;" data-ar="تأكيد الطلب (الدفع عند الاستلام)" data-en="Confirm Order (Cash on Delivery)">تأكيد الطلب (الدفع عند الاستلام)</button>
            </form>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-placeholder"></div>

    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        let offerRules = { freeShippingOver: 0, discountCategory: '', discountPercent: 0 };
        let allProductsCatalog = [];
        let appliedPromo = null; // يحفظ كود الخصم المطبق حالياً
        let isFreeShippingFromPromo = false;

        function parsePrice(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            const cleaned = String(val).replace(/[^0-9.]/g, '');
            return parseFloat(cleaned) || 0;
        }

        function getCartData() {
            const keys = ['bigMuscleCart', 'bigmuscle_cart', 'cart'];
            for (let key of keys) {
                try {
                    const data = localStorage.getItem(key);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch(e) {}
            }
            return [];
        }

        let currentCart = getCartData();
        let cartSubtotal = 0;
        let calculatedDiscount = 0;

        // جلب قواعد العروض والمنتجات معاً
        async function fetchOfferRulesAndProducts() {
            try {
                const [annRes, prodRes] = await Promise.all([
                    fetch('/api/announcement'),
                    fetch('/api/products')
                ]);

                if (annRes.ok) offerRules = await annRes.json();
                if (prodRes.ok) allProductsCatalog = await prodRes.json();

            } catch (e) {
                console.log('Error fetching initial data:', e);
            }
            updateOrderTotal();
        }

        // تطبيق كود الخصم
        async function applyPromoCode() {
            const codeInput = document.getElementById('promoCodeInput');
            const msg = document.getElementById('promoStatusMsg');
            const code = codeInput.value.trim().toUpperCase();

            if (!code) {
                msg.style.display = 'block';
                msg.style.color = '#ff4444';
                msg.textContent = 'من فضلك ادخل كود الخصم أولاً';
                return;
            }

            try {
                const res = await fetch('/api/promocodes/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, subtotal: cartSubtotal })
                });

                const result = await res.json();

                if (result.valid) {
                    appliedPromo = result;
                    msg.style.display = 'block';
                    msg.style.color = '#00cc66';
                    msg.textContent = '✅ ' + result.message;

                    document.getElementById('applyPromoBtn').style.display = 'none';
                    document.getElementById('removePromoBtn').style.display = 'inline-block';
                    codeInput.disabled = true;

                    updateOrderTotal();
                } else {
                    msg.style.display = 'block';
                    msg.style.color = '#ff4444';
                    msg.textContent = '❌ ' + result.message;
                }
            } catch (err) {
                msg.style.display = 'block';
                msg.style.color = '#ff4444';
                msg.textContent = '❌ تعذر التحقق من كود الخصم حالياً';
            }
        }

        // إلغاء كود الخصم والعودة للعروض التلقائية
        function removePromoCode() {
            appliedPromo = null;
            isFreeShippingFromPromo = false;

            const codeInput = document.getElementById('promoCodeInput');
            const msg = document.getElementById('promoStatusMsg');

            codeInput.value = '';
            codeInput.disabled = false;
            document.getElementById('applyPromoBtn').style.display = 'inline-block';
            document.getElementById('removePromoBtn').style.display = 'none';

            msg.style.display = 'block';
            msg.style.color = '#ff9900';
            msg.textContent = 'تم إزالة كود الخصم، وتمت العودة للعروض التلقائية.';

            setTimeout(() => { msg.style.display = 'none'; }, 3000);

            updateOrderTotal();
        }

        // حساب المجموع والخصومات (مع تطبيق شرط عدم تداخل العروض)
        function calculateTotals() {
            cartSubtotal = 0;
            calculatedDiscount = 0;
            isFreeShippingFromPromo = false;

            // 1. حساب المجموع الأساسي
            currentCart.forEach(item => {
                const price = parsePrice(item.price);
                const qty = parsePrice(item.quantity) || 1;
                cartSubtotal += (price * qty);
            });

            document.getElementById('subtotalText').textContent = cartSubtotal.toLocaleString() + ' EGP';

            // 2. إذا تم تطبيق كود خصم (يلغى العرض التلقائي ويطبق الكود)
            if (appliedPromo) {
                const targetCat = (appliedPromo.category || '').toLowerCase().trim();

                if (appliedPromo.type === 'percentage') {
                    if (targetCat) {
                        currentCart.forEach(item => {
                            const dbProd = allProductsCatalog.find(p => String(p._id || p.id) === String(item.id));
                            const catName = dbProd ? (dbProd.category || '') : (item.category || '');
                            const prodName = dbProd ? (dbProd.name || '') : (item.name || '');
                            const fullText = (catName + ' ' + prodName).toLowerCase();
                            
                            if (fullText.includes(targetCat)) {
                                const price = parsePrice(item.price);
                                const qty = parsePrice(item.quantity) || 1;
                                calculatedDiscount += (price * qty) * (appliedPromo.value / 100);
                            }
                        });
                    } else {
                        calculatedDiscount = cartSubtotal * (appliedPromo.value / 100);
                    }
                } else if (appliedPromo.type === 'fixed') {
                    calculatedDiscount = appliedPromo.value;
                } else if (appliedPromo.type === 'free_shipping') {
                    isFreeShippingFromPromo = true;
                }

                // إخفاء العرض التلقائي وعرض سطر الكود
                document.getElementById('autoDiscountRow').style.display = 'none';
                const promoRow = document.getElementById('promoDiscountRow');
                if (calculatedDiscount > 0 || isFreeShippingFromPromo) {
                    promoRow.style.display = 'flex';
                    document.getElementById('promoDiscountLabel').textContent = `كود الخصم (${appliedPromo.code}):`;
                    document.getElementById('promoDiscountText').textContent = isFreeShippingFromPromo ? 'شحن مجاني' : '-' + Math.round(calculatedDiscount).toLocaleString() + ' EGP';
                } else {
                    promoRow.style.display = 'none';
                }

            } else {
                // 3. في حالة عدم وجود كود خصم (يطبق العرض التلقائي)
                const targetCat = (offerRules.discountCategory || '').toLowerCase().trim();
                const discountPct = offerRules.discountPercent || 0;

                if (discountPct > 0) {
                    currentCart.forEach(item => {
                        const dbProd = allProductsCatalog.find(p => String(p._id || p.id) === String(item.id));
                        const catName = dbProd ? (dbProd.category || '') : (item.category || '');
                        const prodName = dbProd ? (dbProd.name || '') : (item.name || '');
                        const fullText = (catName + ' ' + prodName).toLowerCase();

                        if (!targetCat || fullText.includes(targetCat)) {
                            const price = parsePrice(item.price);
                            const qty = parsePrice(item.quantity) || 1;
                            calculatedDiscount += (price * qty) * (discountPct / 100);
                        }
                    });
                }

                document.getElementById('promoDiscountRow').style.display = 'none';
                const autoRow = document.getElementById('autoDiscountRow');
                if (calculatedDiscount > 0) {
                    autoRow.style.display = 'flex';
                    document.getElementById('autoDiscountLabel').textContent = targetCat 
                        ? `خصم العرض (${discountPct}% على ${offerRules.discountCategory}):` 
                        : `خصم العرض (${discountPct}%):`;
                    document.getElementById('autoDiscountText').textContent = '-' + Math.round(calculatedDiscount).toLocaleString() + ' EGP';
                } else {
                    autoRow.style.display = 'none';
                }
            }
        }

        // تحديث المجموع النهائي مع الشحن
        function updateOrderTotal() {
            calculateTotals();

            const regionSelect = document.getElementById('customerRegion');
            let baseShippingCost = parsePrice(regionSelect.value);

            if (!regionSelect.value) {
                document.getElementById('shippingText').textContent = 'اختر المنطقة';
                document.getElementById('shippingText').style.color = '#ff9900';
                const total = Math.max(0, cartSubtotal - calculatedDiscount);
                document.getElementById('totalText').textContent = Math.round(total).toLocaleString() + ' EGP';
                return;
            }

            let finalShippingCost = baseShippingCost;

            if (appliedPromo) {
                if (isFreeShippingFromPromo) {
                    finalShippingCost = 0;
                    document.getElementById('shippingText').textContent = '0 EGP (🎉 شحن مجاني بالكود)';
                    document.getElementById('shippingText').style.color = '#00cc66';
                } else {
                    document.getElementById('shippingText').textContent = baseShippingCost + ' EGP';
                    document.getElementById('shippingText').style.color = '#ffffff';
                }
            } else {
                const freeThreshold = offerRules.freeShippingOver || 0;
                if (freeThreshold > 0 && cartSubtotal >= freeThreshold) {
                    finalShippingCost = 0;
                    document.getElementById('shippingText').textContent = '0 EGP (🎉 شحن مجاني بالعرض)';
                    document.getElementById('shippingText').style.color = '#00cc66';
                } else {
                    document.getElementById('shippingText').textContent = baseShippingCost + ' EGP';
                    document.getElementById('shippingText').style.color = '#ffffff';
                }
            }

            const grandTotal = Math.max(0, cartSubtotal - calculatedDiscount + finalShippingCost);
            document.getElementById('totalText').textContent = Math.round(grandTotal).toLocaleString() + ' EGP';
        }

        document.addEventListener('DOMContentLoaded', fetchOfferRulesAndProducts);

        // إرسال الطلب مع تفاصيل الكود والخصم
        const checkoutForm = document.getElementById('checkout-form');
        if (checkoutForm) {
            checkoutForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                currentCart = getCartData();
                if (currentCart.length === 0) {
                    alert('سلتك فارغة! / Your cart is empty!');
                    return;
                }

                const regionSelect = document.getElementById('customerRegion');
                if (!regionSelect.value) {
                    alert('من فضلك اختر المنطقة لتحديد سعر التوصيل');
                    return;
                }

                let baseShippingCost = parsePrice(regionSelect.value);
                let finalShippingCost = baseShippingCost;

                if (appliedPromo) {
                    if (isFreeShippingFromPromo) finalShippingCost = 0;
                } else {
                    const freeThreshold = offerRules.freeShippingOver || 0;
                    if (freeThreshold > 0 && cartSubtotal >= freeThreshold) finalShippingCost = 0;
                }

                const grandTotal = Math.max(0, cartSubtotal - calculatedDiscount + finalShippingCost);
                const regionName = regionSelect.options[regionSelect.selectedIndex].text;

                const orderData = {
                    customerName: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    notes: document.getElementById('notes').value,
                    region: regionName,
                    shippingFee: finalShippingCost,
                    discountAmount: Math.round(calculatedDiscount),
                    promoCodeUsed: appliedPromo ? appliedPromo.code : null,
                    items: currentCart,
                    subtotal: cartSubtotal,
                    totalAmount: grandTotal
                };

                try {
                    const response = await fetch('/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderData)
                    });

                    alert('تم تأكيد الطلب بنجاح! سنتواصل معك قريباً');
                    localStorage.removeItem('bigMuscleCart');
                    localStorage.removeItem('bigmuscle_cart');
                    localStorage.removeItem('cart');
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error('Order Error:', error);
                    alert('تم تسجيل الطلب بنجاح!');
                    localStorage.removeItem('bigMuscleCart');
                    localStorage.removeItem('bigmuscle_cart');
                    localStorage.removeItem('cart');
                    window.location.href = 'index.html';
                }
            });
        }
    </script>
</body>
</html>
